<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>votabot · Acceso</title>
  <style>
    body { align-items: center; background: #101827; color: #e5e7eb; display: flex; font-family: system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; }
    main { background: #1f2937; border-radius: 12px; box-shadow: 0 16px 45px #0008; max-width: 360px; padding: 32px; width: calc(100% - 48px); }
    h1 { margin: 0; } input, button { box-sizing: border-box; font: inherit; padding: 12px; width: 100%; } input { border: 1px solid #4b5563; border-radius: 6px; margin: 8px 0 16px; } button { background: #22c55e; border: 0; border-radius: 6px; color: #052e16; cursor: pointer; font-weight: 700; } .error { color: #fca5a5; } .campaign { background: linear-gradient(135deg, #ec4899, #f97316); border-radius: 10px; color: #fff; margin: 24px 0; padding: 20px; text-align: center; } .campaign p { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em; margin: 0 0 8px; text-transform: uppercase; } .campaign strong { display: block; font-size: 1.75rem; line-height: 1.1; }
  </style>
</head>
<body>
  <main>
    <h1>Bienvenido a votabot</h1>
    <section class="campaign">
      <p>Esta votación es por</p>
      <strong>Manelyk González</strong>
    </section>
    <p>Acceso de administrador</p>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}
    <form method="post">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
